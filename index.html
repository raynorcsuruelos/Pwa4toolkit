    <script>(()=>{
'use strict';
const DB='raynor_toolkit_recovery_v1', DATA='records', SNAP='snapshots';
const structured=/^(kuwait_ic_arp_calc_|kuwait_ic_rotation_sked_|wlkf\.data\.|wl_tool_faqs_(tools|data)_)/;
let db=null, busy=false, lastSnapshot=0, error='', previousData=null, pending=false;
function openDB(){return new Promise((resolve,reject)=>{if(!indexedDB)return reject(Error('IndexedDB unavailable'));const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{r.result.createObjectStore(DATA);r.result.createObjectStore(SNAP,{keyPath:'createdAt'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function request(req){return new Promise((ok,no)=>{req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)})}
function txDone(tx){return new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error||Error('Transaction aborted'))})}
function keys(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&structured.test(k))o[k]=localStorage.getItem(k)}return o}
function allLocal(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k!==null)o[k]=localStorage.getItem(k)}return o}
async function mirror(force=false){
 if(!db){return;}if(busy){pending=true;return;}
 const data=keys(),before=previousData||{};
 // Compare keys directly: avoid sorting and serializing every stored value

 }

  if(Object.hasOwn(before,k)&&!Object.hasOwn(data,k))removed.push(k);
 }
 if(!force&&!changed.length&&!removed.length)return;
 busy=true;
 try{
  if(changed.length||removed.length){
   const t=db.transaction(DATA,'readwrite'),store=t.objectStore(DATA);
   for(const [k,v] of changed)store.put(v,k);
   for(const k of removed)store.delete(k);

}
async function snapshot(data=keys()){if(!db)return;const createdAt=Date.now(),t=db.transaction(SNAP,'readwrite');t.objectStore(SNAP).put({createdAt,data});await txDone(t);lastSnapshot=createdAt;await prune()}
async function prune(){const t=db.transaction(SNAP,'readwrite'),s=t.objectStore(SNAP);const done=txDone(t),all=await request(s.getAllKeys());for(const k of all.slice(0,-12))s.delete(k);await done}
function setStatus(message,failed=false){error=failed?message:'';const el=document.getElementById('raynor-storage-status');if(el){if(el.textContent!==message)el.textContent=message;const color=failed?'#b91c1c':'#166534';if(el.style.color!==color)el.style.color=color}}
async function init(){try{

  for(let i=0;i<saved.length;i++){
   const key=saved[i],val=values[i];
   if(structured.test(key)&&localStorage.getItem(key)===null&&typeof val==='string'){

   }

 // Establish a baseline from the actual database to synchronize deletions.

 setStatus(restored?'Recovered '+restored+' missing records':'Saved locally');
 }catch(e){setStatus('IndexedDB unavailable; original saving remains active',true);console.warn('Toolkit storage:',e)}
}
window.__toolkitStorageReady=init();

async function exportBackup(){await mirror();const backup={format:'raynor-toolkit-backup',version:1,createdAt:new Date().toISOString(),origin:location.origin,localStorage:allLocal(),indexedDB:await collectDexie()};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='My-Personal-Toolkit-Backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);setStatus('Backup exported')}
async function restoreDexie(all){for(const [name,info] of Object.entries(all||{})){const database=await new Promise((ok,no)=>{const r=indexedDB.open(name);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);r.onupgradeneeded=()=>{r.transaction.abort();no(Error('Database '+name+' not installed'))}});try{for(const [storeName,entry] of Object.entries(info.stores||{})){if(!database.objectStoreNames.contains(storeName))continue;const t=database.transaction(storeName,'readwrite'),store=t.objectStore(storeName);for(let i=0;i<entry.records.length;i++){const value=entry.records[i];if(store.keyPath===null)store.put(value,entry.primaryKeys[i]);else store.put(value)}await txDone(t)}}finally{database.close()}}}
async function importBackup(file){let data;try{data=JSON.parse(await file.text())}catch{throw Error('Invalid JSON file')}if(data.format!=='raynor-toolkit-backup'||data.version!==1||!data.localStorage||typeof data.localStorage!=='object')throw Error('Not a compatible Toolkit backup');if(!confirm('Restore backup from '+data.createdAt+'? Existing matching records will be replaced. A recovery snapshot will be saved first.'))return;await mirror(true);await snapshot();await restoreDexie(data.indexedDB);for(const [k,v] of Object.entries(data.localStorage)){if(typeof v==='string')localStorage.setItem(k,v)}await mirror(true);alert('Backup restored. The toolkit will reload now.');location.reload()}
function mount(){if(document.getElementById('raynor-backup-controls'))return;const host=document.createElement('div');host.id='raynor-backup-controls';host.style.cssText='position:fixed;bottom:12px;right:12px;z-index:2147483000;background:#fff;color:#003057;border:1px solid #cbd5e1;border-radius:9px;padding:7px;box-shadow:0 2px 12px #0002;font:12px Arial,sans-serif;display:flex;align-items:center;gap:6px;max-width:calc(100vw - 24px)';const status=document.createElement('span');status.id='raynor-storage-status';status.textContent=error||'Checking storage';status.style.cssText='font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';const exp=document.createElement('button');exp.textContent='Backup JSON';const imp=document.createElement('button');imp.textContent='Restore';for(const b of [exp,imp])b.style.cssText='border:1px solid #94a3b8;border-radius:5px;background:#f8fafc;color:#003057;padding:5px 8px;cursor:pointer';const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.hidden=true;exp.onclick=()=>exportBackup().catch(e=>{setStatus('Backup failed: '+e.message,true);alert(e.message)});imp.onclick=()=>input.click();input.onchange=async()=>{if(input.files[0])try{await importBackup(input.files[0])}catch(e){setStatus('Restore failed: '+e.message,true);alert(e.message)}finally{input.value=''}};host.append(status,exp,imp,input);document.body.appendChild(host);if(error)setStatus(error,true)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount,{once:true});else mount();// Run periodic recovery checks only while the toolkit is visible.
// Restart immediately on return; avoid background wake-ups on inactive tabs.
let recoveryTimer=null;
function stopRecoveryTimer(){if(recoveryTimer!==null){clearTimeout(recoveryTimer);recoveryTimer=null}}
function scheduleRecoveryTimer(){
 stopRecoveryTimer();
 if(document.visibilityState!=='visible')return;
 recoveryTimer=setTimeout(()=>{
  recoveryTimer=null;
  mirror().catch(console.error).finally(scheduleRecoveryTimer);
 },10000);
}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden'){
  stopRecoveryTimer();
  mirror().catch(console.error);
 }else{
  mirror().catch(console.error);
  scheduleRecoveryTimer();
 }
});
// Cross-tab localStorage changes should not wait for the next periodic check.
window.addEventListener('storage',event=>{
 if(event.storageArea===localStorage&&event.key&&structured.test(event.key)){
  mirror().catch(console.error);
 }
});
window.addEventListener('pagehide',()=>{stopRecoveryTimer();mirror().catch(console.error)});
scheduleRecoveryTimer();
})();</script>

q:`How to check the integrity of the motor?`,a:`Check the resistance between UH3-UH8 and UH9-UH10, should be 88Ω +/- 10Ω.`,remarks:`Ideally value should be balanced, 1.5Ω difference as per SWI.`,notes:`Megger only on UH3 or UH8, >100MΩ. UH10 is shorted to mass.`},{id:`usis-4`,q:`What is the Part Number of the SCREW needed to secure USRS and IBC subs?`,a:`B016090 is the correct p/n of the screw.`,remarks:`Make sure that B016090 ONLY has 4 threads.`,notes:`A longer screw will touch the Rotating Housing causing oil leaks or motor failure.`},{id:`usis-5`,q:`What is the part number of USIS Centralizer Springs?`,a:`P289119 - Leaf spring for USIS centralizer`,remarks:`Use proper PPE during removal and installation.`,notes:`Different from CMIR-EA/CME-AF`},{id:`usis-6`,q:`What are the p/n of Centralizer Rollers?`,a:`P222602-Roller, P296721-Bushing, P284704-Pin, B013313-Spirol pin`,remarks:`Replace Centralizer Roller with p/n P222602 when OD is smaller than 24.5mm.`,notes:`Check Bushing and Pin wear.`}],hrms:[{id:`hrms-1`,q:`What is the oil needed to fill/top-up this tool?`,a:`103063625 - DD-27 Oil`,remarks:`Usually in 5 gallon yellow colored plastic container`,notes:`Fill in the FILL PORT only, bottom part of UH section.`}],ppc:[{id:`ppc-1`,q:`What is the oil needed to fill/top-up this tool?`,a:`103063625 - DD-27 Oil`,remarks:`Usually in 5 gallon yellow colored plastic container`,notes:`Fill in the FILL PORT only, marked F in Compensating Housing.`}],emm:[{id:`emm-1`,q:`What is the oil needed to fill/top-up this tool?`,a:`103063625 - DD-27 Oil`,remarks:`Usually in 5 gallon yellow colored plastic container`,notes:`Fill in the FILL PORT only, near the Compensating Window.`}],resolve:[{id:`resolve-1`,q:`What is the oil needed to fill/top-up this tool?`,a:`103063625 - DD-27 Oil`,remarks:`Usually in 5 gallon yellow colored plastic container`,notes:`Fill in the FILL PORT only, marked F in SPCPS. Use a gauge/dipstick to measure piston level, set at Max.`},{id:`resolve-2`,q:`What is the part number of Spirol Pin needed to secure the SPRPS threaded ring to SPTCS?`,a:`B016033 - Spirol Pins`,remarks:`Install brand new Spirol Pins after every service, DO NOT FORGET TO INSTALL!`,notes:`Make sure that these two Spirol Pins are removed before tool disconnection.`},{id:`resolve-3`,q:`What is the part number of Retaining Rings needed to install the Coupling Sleeve between SPRPS and SPTCS?`,a:`100604349/B044126(preferred) - Retaining Rings`,remarks:`Install brand new Retaining Rings after every service, DO NOT FORGET TO INSTALL!`,notes:`Use the proper circlip pliers during installation to prevent damage.`},{id:`resolve-4`,q:`What is the Torque needed to tighten the Retainer Nut 105003953 at the bottom of SPTCS?`,a:`300 in.lbf or 25 ft.lbf of torque is required`,remarks:`Lubricate with grease and tighten Retainer Nut using calibrated torque Wrench and SFT 103153024.`,notes:`Double check the setting of Torque Wrench before using.`}],spear:[{id:`spear-1`,q:`What is the oil needed to fill/top-up this tool?`,a:`103063625 - DD-27 Oil`,remarks:`Usually in 5 gallon yellow colored plastic container`,notes:`Fill in the FILL PORT only, marked F in SPCPS. Use a gauge/dipstick to measure piston level, set at Max.`},{id:`spear-2`,q:`What are the resistance values of Spear HV Motors when connected together?`,a:`4 drives = 5Ω, 3 drives = 6.67Ω, 2 drives = 10Ω , 1 drive = 18Ω-21Ω`,remarks:`Tolerance on resistance readings on multiple drives are +/- 5%.`,notes:`Measurement done on SPHYS UH4-UH9, UH4-UH10, and UH9-UH10. Ideally, all readings should be balanced.`},{id:`spear-3`,q:`What is the Torque needed to tighten the Wheel Attachment Screw?`,a:`82 in.lbf of torque is required`,remarks:`Apply Loctite 246 (pn B046992) on Wheel Attachment Screw p/n 103270330 and Gold Grease on the wheels.`,notes:`Double check the setting of Torque Wrench and use T30 Torx Bit with SFT 103202446.`}],tufftrac:[{id:`tufftrac-1`,q:`What is the oil needed to fill/top-up this tool?`,a:`103063625 - DD-27 Oil`,remarks:`Usually in 5 gallon yellow colored plastic container`,notes:`Fill in the FILL PORT only, marked F in XHMS or XDUS. Check oil level in the XCAS using a gauge/dipstick.`},{id:`tufftrac-2`,q:`What is the Torque needed to tighten the Wheel Attachment Screw?`,a:`18 ft.lbf of torque is required`,remarks:`Wheel Attachment Screw p/n 100586377 and Red High Temp grease on the wheels.`,notes:`Torque Wrench is fixed at 18 ft.lbf, use T30 Torx Plus Bit with SFT 100838495.`}],dsi:[{id:`dsi-1`,q:`What is the oil needed to fill/top-up this tool?`,a:`B015518 - Capella Oil`,remarks:`Usually in 1 gallon white colored plastic container`,notes:`Usually filled only in FIT room, contact TLM if needed in the field.`}],msip:[{id:`msip-1`,q:`What is the oil needed to fill/top-up this tool?`,a:`B950546 - Shin-Etsu Oil`,remarks:`Usually in 16kg can, reacts with other oils and forms a gluey stuff that plugs holes.`,notes:`Fill in the FILL PORT only, near the Compensating Window. Use ONLY DEDICATED Adaptors!`}],fsis:[{id:`fsis-1`,q:`What is the p/n of MS1-4, HD?`,a:`101317948 - Low Flow`,remarks:`Check actual OD, usually light blue.`,notes:`Keep in mind the orientation when installing in the support.`},{id:`fsis-2`,q:`What is the p/n of MS0, HD?`,a:`101305786 - Low Flow`,remarks:`Check actual OD, usually dark blue.`,notes:`Keep in mind the orientation when installing in the support.`},{id:`fsis-3`,q:`What is the p/n of O-probe`,a:`P787564 - O-probe`,remarks:`Check tip.`,notes:`Keep the protector installed.`},{id:`fsis-4`,q:`What is the p/n of E-probe`,a:`100089331 - E-probe`,remarks:`Check tip.`,notes:`Keep the protector installed.`}]},an=`wl_tool_faqs_tools_kuwait_v3`,on=`wl_tool_faqs_data_kuwait_v3`,sn=`wl_tool_faqs_creds_salted_v3`,cn=({onNotify:e})=>{let[t,n]=(0,b.useState)(()=>{try{let e=localStorage.getItem(an);if(e)return JSON.parse(e)}catch{}return nn}),[r,i]=(0,b.useState)(()=>{try{let e=localStorage.getItem(on);if(e)return JSON.parse(e)}catch{}return rn}),[a,o]=( /* ARP overview layout repair: preserve the heading's natural height. */
@media (min-width:1024px){
  div:has(> .arp-table-pair + .arp-day-planner){
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:auto;
    gap:16px;
    align-items:start;
  }
  div:has(> .arp-table-pair + .arp-day-planner) > :not(.arp-table-pair):not(.arp-day-planner){
    grid-column:1 / -1;
    order:0;
    min-height:0;
  }
  div:has(> .arp-table-pair + .arp-day-planner) > .arp-table-pair{display:contents}
  div:has(> .arp-table-pair + .arp-day-planner) > .arp-table-pair > :nth-child(2){
    order:1;grid-column:1;min-width:0;
    height:620px;max-height:620px;overflow-y:auto;box-sizing:border-box;
  }
  div:has(> .arp-table-pair + .arp-day-planner) > .arp-day-planner{
    order:2;grid-column:2;min-width:0;
    height:620px;max-height:620px;overflow-y:auto;box-sizing:border-box;
  }
  div:has(> .arp-table-pair + .arp-day-planner) > .arp-table-pair > :first-child{
    order:3;grid-column:1 / -1;min-height:0;
  }
}
.arp-table-pair > :first-child table{width:100%}
.arp-table-pair > :first-child th,.arp-table-pair > :first-child td{padding-top:5px;padding-bottom:5px}

/* Compact ARP planner and remove redundant external portal panels. */
.arp-day-planner{align-self:start}
.arp-day-planner .grid.grid-cols-7 button{min-width:0}
@media(min-width:1024px){
 div:has(> .arp-table-pair + .arp-day-planner) > .arp-table-pair > :nth-child(2),
 div:has(> .arp-table-pair + .arp-day-planner) > .arp-day-planner{height:auto!important;max-height:none!important;overflow:visible!important;min-height:0!important}
}

/* ARP desktop equal-height panels: stretch the planner to the calculation card.
   Do not force a fixed height or introduce internal scrollbars. */
@media (min-width:1024px) {
  div:has(> .arp-table-pair + .arp-day-planner) {
    align-items:stretch !important;
    grid-template-rows:auto !important;
  }
  div:has(> .arp-table-pair + .arp-day-planner) > .arp-table-pair > :nth-child(2),
  div:has(> .arp-table-pair + .arp-day-planner) > .arp-day-planner {
    height:100% !important;
    min-height:0 !important;
    max-height:none !important;
    align-self:stretch !important;
    overflow:hidden !important;
    box-sizing:border-box;
  }
  div:has(> .arp-table-pair + .arp-day-planner) > .arp-day-planner {
    display:flex;
    flex-direction:column;
